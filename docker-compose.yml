version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-plotcraft_db}
      MYSQL_USER: ${DB_USER:-myuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  adminer: # 🔹 สำหรับเข้าไปส่องตารางใน MySQL
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  chroma_db: # ฐานข้อมูล Vector (RAG) ของเรา
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000" # 🔹 ดึงพอร์ต 8001 ออกมาให้คอมพิวเตอร์เราส่องได้โดยตรง
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"] # 🔹 เปิดประตูให้หน้าเว็บที่เราสร้างเข้าไปส่องข้อมูลได้
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn mysite.wsgi:application --bind 0.0.0.0:8000 --workers 1 --timeout 120
    volumes:
      - .:/code
      - huggingface_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    shm_size: '2gb'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      chroma_db: 
        condition: service_started
    environment:
      - DEBUG=1  
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,[::1]
      - CHROMA_HOST=chroma_db 
      - CHROMA_PORT=8000  

volumes:
  db_data:
  chroma_data:
  huggingface_cache: