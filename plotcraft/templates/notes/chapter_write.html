{% extends "base.html" %}{% block title %}{{ chapter.title }} | PlotCraft{% endblock %}{% block content %}
<section class="pc-page-shell"><div class="max-w-5xl mx-auto"><div class="flex justify-between gap-5 mb-6"><div><a href="{% url 'plotcraft:novel_detail' novel.id %}" class="text-sm text-[#b7f34b]">← Back to manuscript</a><div class="pc-eyebrow mt-5">Chapter editor</div><h1 class="mt-2 text-3xl font-extrabold text-white">{{ chapter.title }}</h1></div><a href="{% url 'plotcraft:chapter_preview' chapter.id %}" class="pc-button pc-button--quiet">Preview</a></div><div class="pc-panel rounded-3xl border border-white/10 p-5 md:p-8"><label class="block text-sm font-semibold text-white mb-2" for="chapter-title">Chapter title</label><input id="chapter-title" value="{{ chapter.title }}" class="w-full rounded-xl bg-black/20 border border-white/15 px-4 py-3 text-white"><label class="block text-sm font-semibold text-white mt-6 mb-2" for="chapter-content">Writing</label><textarea id="chapter-content" class="w-full min-h-[60vh] rounded-xl bg-black/20 border border-white/15 px-4 py-4 text-white leading-8">{{ chapter.content }}</textarea><div class="mt-5 flex items-center gap-4"><button id="save-button" class="pc-button pc-button--primary">Save chapter</button><span id="save-status" class="text-sm text-white/60"></span></div></div></div></section>
<script>document.getElementById("save-button").addEventListener("click",async function(){const b=this,s=document.getElementById("save-status");b.disabled=true;s.textContent="Saving…";try{const r=await fetch("#",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded","X-CSRFToken":"{{ csrf_token }}","X-Requested-With":"XMLHttpRequest"},body:new URLSearchParams({title:document.getElementById("chapter-title").value,content:document.getElementById("chapter-content").value,is_draft:"true"})});if(!r.ok)throw new Error();s.textContent="Saved";}catch(e){s.textContent="Could not save. Please try again.";}finally{b.disabled=false;}});</script>{% endblock %}
