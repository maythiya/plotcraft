<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PlotCraft{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/plotcraft-theme.css">
</head>
<body class="pc-app">
  <div class="pc-shell">
    {% include "navbar.html" %}
    <main class="pc-main">
      <header class="pc-topbar">
        <div><div class="pc-eyebrow">PlotCraft Workspace</div><div class="pc-topbar__title">Bring your story world to life.</div></div>
        <div class="pc-topbar__actions"><span class="pc-topbar__pill">Writing mode</span><span class="pc-topbar__dot" aria-label="Online"></span></div>
      </header>
      {% block content %}{% endblock %}
    </main>
  </div>
  <div id="ai-chat-window" class="fixed bottom-28 right-10 w-96 bg-white rounded-2xl shadow-2xl border border-gray-200 hidden flex-col z-50 overflow-hidden transition-all duration-300 transform scale-95 opacity-0">
    <div class="bg-[#103b2b] text-white p-4 flex justify-between items-center">
      <div class="flex items-center gap-2"><svg aria-hidden="true" class="pc-icon w-5 h-5" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M8 12h.01M16 12h.01M8 16h8"/></svg><h3 class="font-bold">PlotCraft Assistant</h3></div>
      <button type="button" onclick="toggleChat()" class="hover:bg-white/20 rounded-full p-1 transition" aria-label="Close assistant">×</button>
    </div>
    <div id="chat-messages" class="flex-1 p-4 h-80 overflow-y-auto bg-gray-50 space-y-3">
      <div class="flex justify-start"><div class="bg-white border border-gray-200 rounded-lg rounded-tl-none p-3 max-w-[85%] text-sm shadow-sm text-gray-700">Hello! I’m your writing assistant. What would you like to create or check today?</div></div>
    </div>
    <div class="p-3 bg-white border-t border-gray-100">
      <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
        <input type="text" id="chat-input" class="flex-1 border border-gray-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-[#103b2b] focus:ring-1 focus:ring-[#103b2b]" placeholder="Type a message..." autocomplete="off">
        <button type="submit" class="bg-[#103b2b] text-white p-2 rounded-full hover:bg-[#08261b] disabled:opacity-50 transition shadow-md" aria-label="Send message">↑</button>
      </form>
    </div>
  </div>
  <div class="fixed bottom-10 right-10 z-50"><button type="button" onclick="toggleChat()" class="pc-chat-fab w-14 h-14 rounded-full shadow-lg border-2 text-white flex items-center justify-center hover:scale-110 transition duration-200" aria-label="Open assistant"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg></button></div>
  <script>
    function toggleChat() {
      const chatWindow = document.getElementById("ai-chat-window");
      if (chatWindow.classList.contains("hidden")) {
        chatWindow.classList.remove("hidden");
        setTimeout(function () {
          chatWindow.classList.remove("opacity-0", "scale-95");
          chatWindow.classList.add("opacity-100", "scale-100");
          document.getElementById("chat-input").focus();
        }, 10);
      } else {
        chatWindow.classList.remove("opacity-100", "scale-100");
        chatWindow.classList.add("opacity-0", "scale-95");
        setTimeout(function () { chatWindow.classList.add("hidden"); }, 300);
      }
    }
    async function sendMessage(event) {
      event.preventDefault();
      const input = document.getElementById("chat-input");
      const messages = document.getElementById("chat-messages");
      const message = input.value.trim();
      if (!message) return;
      appendMessage(message, "user");
      input.value = "";
      const loadingId = "loading-" + Date.now();
      appendLoading(loadingId);
      messages.scrollTop = messages.scrollHeight;
      let novelId = null;
      const path = window.location.pathname;
      const params = new URLSearchParams(window.location.search);
      const notesMatch = path.match(/\/notes\/(\d+)\//);
      if (notesMatch) novelId = notesMatch[1];
      if (!novelId && params.has("project")) novelId = params.get("project");
      try {
        const response = await fetch("/api/chat/general/", {method: "POST", headers: {"Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}"}, body: JSON.stringify({message: message, novel_id: novelId})});
        const data = await response.json();
        document.getElementById(loadingId)?.remove();
        appendMessage(data.reply || "Something went wrong while processing your request.", "bot", !data.reply);
      } catch (error) {
        document.getElementById(loadingId)?.remove();
        appendMessage("Unable to connect to the server.", "bot", true);
        console.error(error);
      }
      messages.scrollTop = messages.scrollHeight;
    }
    function appendMessage(text, sender, isError) {
      const messages = document.getElementById("chat-messages");
      const row = document.createElement("div");
      row.className = sender === "user" ? "flex justify-end" : "flex justify-start";
      const bubble = document.createElement("div");
      bubble.className = sender === "user" ? "bg-[#103b2b] text-white rounded-lg rounded-tr-none p-3 max-w-[85%] text-sm shadow-md" : "bg-white border border-gray-200 rounded-lg rounded-tl-none p-3 max-w-[85%] text-sm shadow-sm " + (isError ? "text-red-600 bg-red-50 border-red-200" : "text-gray-700");
      bubble.innerHTML = String(text).replace(/\n/g, "<br>");
      row.appendChild(bubble); messages.appendChild(row);
    }
    function appendLoading(id) {
      const messages = document.getElementById("chat-messages");
      const row = document.createElement("div"); row.id = id; row.className = "flex justify-start animate-pulse";
      row.innerHTML = "<div class=\"bg-white border border-gray-200 rounded-lg rounded-tl-none p-3 shadow-sm flex gap-1\"><div class=\"w-2 h-2 bg-gray-400 rounded-full animate-bounce\"></div><div class=\"w-2 h-2 bg-gray-400 rounded-full animate-bounce\" style=\"animation-delay:.1s\"></div><div class=\"w-2 h-2 bg-gray-400 rounded-full animate-bounce\" style=\"animation-delay:.2s\"></div></div>";
      messages.appendChild(row);
    }
  </script>
</body>
</html>
