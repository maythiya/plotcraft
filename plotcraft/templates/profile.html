{% extends "base.html" %}{% block title %}Profile | PlotCraft{% endblock %}{% block content %}<section class="pc-page-shell"><div class="max-w-3xl mx-auto pc-panel rounded-3xl border border-white/10 p-7 md:p-10"><div class="pc-eyebrow">PlotCraft account</div><h1 class="mt-2 text-3xl font-extrabold text-white">Profile settings</h1><p class="mt-3 text-white/65">Manage your personal details and profile photo.</p><form method="post" enctype="multipart/form-data" class="mt-8 pc-form-fields">{% csrf_token %}<div class="mb-6">{{ p_form.image }}</div>{{ u_form.as_p }}<button class="pc-button pc-button--primary mt-4" type="submit" name="save_changes">Save changes</button></form></div></section><style>.pc-form-fields p{margin-bottom:1rem}.pc-form-fields label{display:block;color:#fff;font-weight:600;margin-bottom:.35rem}.pc-form-fields input{width:100%;padding:.75rem 1rem;border-radius:.75rem;background:#0a2d20;color:#fff;border:1px solid rgba(255,255,255,.15)}</style>{% endblock %}
