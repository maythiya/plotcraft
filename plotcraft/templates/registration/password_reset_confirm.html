<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตั้งรหัสผ่านใหม่ | PlotCraft</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAEBD7] flex items-center justify-center min-h-screen p-4 font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-[#2F4F4F]/10 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[#2F4F4F] to-[#DAA520]"></div>
        
        <h2 class="text-2xl font-bold text-[#2F4F4F] mb-6 text-center">ตั้งรหัสผ่านใหม่</h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-bold text-[#2F4F4F] mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}
                    <p class="text-xs text-gray-400 mt-1">{{ field.help_text }}</p>
                {% endif %}
                {% for error in field.errors %}
                    <p class="text-xs text-red-500 mt-1">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}

            <button type="submit" class="w-full bg-[#2F4F4F] text-[#FAEBD7] font-bold py-3 rounded-lg hover:bg-[#1a3030] shadow-md hover:-translate-y-0.5 transition mt-4">
                เปลี่ยนรหัสผ่าน
            </button>
        </form>
    </div>
    
    <script>
        document.querySelectorAll('input').forEach(input => {
            input.classList.add('w-full', 'p-3', 'bg-[#FAEBD7]/20', 'border', 'border-[#2F4F4F]/20', 'rounded-lg', 'focus:outline-none', 'focus:ring-2', 'focus:ring-[#DAA520]', 'text-[#2F4F4F]');
        });
    </script>
</body>
</html>
