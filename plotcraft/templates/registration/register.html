<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Register | PlotCraft</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
      .checkbox-theme:checked {
          background-color: #DAA520;
          border-color: #DAA520;
      }
  </style>
</head>
<body class="bg-[#FAEBD7] flex items-center justify-center min-h-screen p-4 font-sans">

  <div class="bg-white p-8 md:p-10 rounded-2xl shadow-2xl w-full max-w-lg border border-[#2F4F4F]/10 relative overflow-hidden my-8">
    <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[#DAA520] to-[#2F4F4F]"></div>

    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-[#2F4F4F]">สมัครสมาชิก</h2>
        <p class="text-gray-500 text-sm mt-2">เริ่มต้นเส้นทางนักเขียนของคุณกับ PlotCraft</p>
    </div>

    {% if form.errors %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg">
            โปรดตรวจสอบข้อมูลให้ถูกต้อง ({{ form.errors|striptags }})
        </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      
      <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-[#2F4F4F] uppercase mb-1">Username</label>
            <input type="text" name="username" class="w-full p-2.5 bg-[#FAEBD7]/20 border border-[#2F4F4F]/20 rounded-lg focus:ring-2 focus:ring-[#DAA520] outline-none" required>
          </div>

          <div>
            <label class="block text-xs font-bold text-[#2F4F4F] uppercase mb-1">Email</label>
            <input type="email" name="email" class="w-full p-2.5 bg-[#FAEBD7]/20 border border-[#2F4F4F]/20 rounded-lg focus:ring-2 focus:ring-[#DAA520] outline-none" required>
          </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-[#2F4F4F] uppercase mb-1">Birthdate</label>
            <input type="date" name="birthdate" class="w-full p-2.5 bg-[#FAEBD7]/20 border border-[#2F4F4F]/20 rounded-lg focus:ring-2 focus:ring-[#DAA520] outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-[#2F4F4F] uppercase mb-1">Phone</label>
            <input type="text" name="phone" class="w-full p-2.5 bg-[#FAEBD7]/20 border border-[#2F4F4F]/20 rounded-lg focus:ring-2 focus:ring-[#DAA520] outline-none">
          </div>
      </div>

      <div class="space-y-4">
          <div class="relative">
            <label class="block text-xs font-bold text-[#2F4F4F] uppercase mb-1">Password</label>
            <input type="password" name="password1" id="regPass1" class="w-full p-2.5 pr-10 bg-[#FAEBD7]/20 border border-[#2F4F4F]/20 rounded-lg focus:ring-2 focus:ring-[#DAA520] outline-none" required>
            <button type="button" onclick="togglePassword('regPass1')" class="absolute right-3 top-8 text-gray-400 hover:text-[#DAA520]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>

          <div class="relative">
            <label class="block text-xs font-bold text-[#2F4F4F] uppercase mb-1">Confirm Password</label>
            <input type="password" name="password2" id="regPass2" class="w-full p-2.5 pr-10 bg-[#FAEBD7]/20 border border-[#2F4F4F]/20 rounded-lg focus:ring-2 focus:ring-[#DAA520] outline-none" required>
            <button type="button" onclick="togglePassword('regPass2')" class="absolute right-3 top-8 text-gray-400 hover:text-[#DAA520]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            </button>
          </div>
      </div>
      
      <div class="flex items-start mt-2">
          <input id="terms" name="terms" type="checkbox" required class="h-4 w-4 mt-0.5 text-[#DAA520] border-gray-300 rounded checkbox-theme focus:ring-[#DAA520]">
          <label for="terms" class="ml-2 block text-xs text-gray-600">
            ฉันยอมรับ <a href="#" class="text-[#DAA520] hover:underline">เงื่อนไขการให้บริการ</a> และ <a href="#" class="text-[#DAA520] hover:underline">นโยบายความเป็นส่วนตัว</a>
          </label>
      </div>

      <button type="submit" class="w-full bg-[#DAA520] text-white font-bold py-3 rounded-lg hover:bg-[#b8860b] shadow-md hover:translate-y-[-2px] transition-all mt-6">
          สมัครสมาชิก
      </button>

    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
        มีบัญชีอยู่แล้ว? <a href="{% url 'plotcraft:login' %}" class="text-[#2F4F4F] font-bold hover:underline">เข้าสู่ระบบ</a>
    </p>
  </div>

  <script>
        function togglePassword(id) {
            var x = document.getElementById(id);
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }
  </script>

</body>
</html>
