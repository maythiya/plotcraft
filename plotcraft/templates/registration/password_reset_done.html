<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ตรวจสอบอีเมล | PlotCraft</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAEBD7] flex items-center justify-center min-h-screen p-4 font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-[#2F4F4F]/10 relative overflow-hidden text-center">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[#2F4F4F] to-[#DAA520]"></div>
        
        <div class="mb-4 text-[#DAA520]">
            <svg class="w-16 h-16 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>

        <h2 class="text-2xl font-bold text-[#2F4F4F] mb-4">ตรวจสอบอีเมลของคุณ</h2>
        <p class="text-gray-600 mb-6">
            เราได้ส่งคำแนะนำในการตั้งรหัสผ่านใหม่ไปที่อีเมลของคุณแล้ว กรุณาตรวจสอบกล่องจดหมาย (หรือ Junk mail)
        </p>
        <p class="text-sm text-gray-400">
            *หมายเหตุ: เนื่องจากทดสอบบนเครื่อง Local ลิงก์จะปรากฏใน Terminal (หน้าจอดำ) แทนอีเมลจริง
        </p>
    </div>
</body>
</html>
