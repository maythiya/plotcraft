<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ลืมรหัสผ่าน | PlotCraft</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAEBD7] flex items-center justify-center min-h-screen p-4 font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md border border-[#2F4F4F]/10 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-[#2F4F4F] to-[#DAA520]"></div>
        
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-[#2F4F4F]">ลืมรหัสผ่าน?</h2>
            <p class="text-gray-500 text-sm mt-2">กรอกอีเมลที่คุณใช้สมัครสมาชิก เราจะส่งลิงก์รีเซ็ตรหัสผ่านไปให้</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-bold text-[#2F4F4F] mb-1">อีเมล</label>
                <input type="email" name="email" class="w-full p-3 bg-[#FAEBD7]/20 border border-[#2F4F4F]/20 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#DAA520] text-[#2F4F4F]" placeholder="name@example.com" required>
            </div>
            <button type="submit" class="w-full bg-[#DAA520] text-white font-bold py-3 rounded-lg hover:bg-[#b8860b] shadow-md hover:-translate-y-0.5 transition">
                ส่งลิงก์รีเซ็ตรหัสผ่าน
            </button>
        </form>
        
        <p class="mt-6 text-center text-sm">
            <a href="{% url 'plotcraft:login' %}" class="text-[#2F4F4F] hover:underline">← กลับไปหน้าเข้าสู่ระบบ</a>
        </p>
    </div>
</body>
</html>
